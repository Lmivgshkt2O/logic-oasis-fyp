# AQC-E2.1 pre-policy contract amendment (ASSISTments EDM Cup 2023).
#
# This file is a CONTRACT / GOVERNANCE / SCHEMA freeze only. It is a separate,
# versioned clarification of assistments-adaptive-contract-v1 whose ONLY
# methodological change is to define deterministic discrete within-skill
# tertile boundaries for proxy difficulty assignment. Every other frozen E1/E2
# parameter is unchanged, and the v1 contract and its hash remain preserved.
#
# Companion evidence: docs/evidence/aqc-assistments-proxy-difficulty-calibration.md
contractVersion: assistments-adaptive-contract-v1.1
contractRole: external_descriptive_stage_b_contract_freeze
predecessorContractVersion: assistments-adaptive-contract-v1
predecessorContractSha256: 46997eaf92d6c9aba0dc7d8d196080bc03bd59093ef5b2f04a1fd6fc4e424170
frozenAt: "2026-08-08"
status: frozen

amendment:
  reason: deterministic_discrete_tertile_boundary_clarification
  scope: within_skill_tertile_boundaries_only
  fixesUnderspecifiedImplementationDetail: true
  motivatedByPolicyPerformance: false
  policyResultsExistedBeforeAmendment: false
  v1Preserved: true
  rationale: >-
    v1 froze within-skill tertile semantics and deterministic ordering but did
    not completely define how rank boundaries are formed when a skill's
    adequately calibrated problem count is not divisible by three. v1.1 freezes
    the rank partition b1 = floor(n/3), b2 = floor(2n/3). No P1/P2/P3a decision,
    matched outcome, or policy-comparison result existed when this amendment was
    made; it is a pure methodology clarification, not a result-driven change.

